name: CRUCIBLE Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # Weekly — Monday 03:00 UTC

permissions:
  contents: read
  security-events: write   # required for upload-sarif
  pull-requests: write     # required to post PR comment

jobs:
  # A live scan needs a target. On forks and secretless public pushes there is no
  # endpoint configured, so gate the scan on the secret's presence — the job is
  # SKIPPED (green), not failed, when CRUCIBLE_ENDPOINT isn't set.
  guard:
    name: Scan target configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          EP: ${{ secrets.CRUCIBLE_ENDPOINT }}
        run: |
          if [ -n "$EP" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CRUCIBLE_ENDPOINT secret configured — skipping the live scan (expected on forks / public pushes). Set repo secrets CRUCIBLE_ENDPOINT / CRUCIBLE_API_KEY / CRUCIBLE_MODEL to enable it."
          fi

  redteam:
    name: AI Safety Scan
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CRUCIBLE
        run: pip install -e ".[pdf]"

      # ── Run the scan ────────────────────────────────────────────────────────
      # continue-on-error so the SARIF upload and PR comment steps always run.
      # We re-raise the failure explicitly at the end.
      - name: Run CRUCIBLE scan
        id: scan
        continue-on-error: true
        env:
          CRUCIBLE_API_KEY:  ${{ secrets.CRUCIBLE_API_KEY }}
          CRUCIBLE_ENDPOINT: ${{ secrets.CRUCIBLE_ENDPOINT }}
          CRUCIBLE_MODEL:    ${{ secrets.CRUCIBLE_MODEL }}
        run: |
          set -o pipefail
          crucible \
            --mode vapt \
            --ci \
            --ci-threshold 20 \
            --no-color \
            --i-am-authorized \
            --skip-connection-test \
            --output-dir reports \
            --api-key  "$CRUCIBLE_API_KEY" \
            --endpoint "$CRUCIBLE_ENDPOINT" \
            --model    "$CRUCIBLE_MODEL" \
            2>&1 | tee scan-output.txt
          echo "scan_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Parse key metrics from terminal output ──────────────────────────────
      - name: Extract scan metrics
        id: metrics
        if: always()
        run: |
          SCORE=$(grep -oP 'OVERALL RISK SCORE\s*:\s*\K[0-9]+' scan-output.txt || echo "N/A")
          LEVEL=$(grep -oP 'RISK LEVEL\s*:\s*\K\S+' scan-output.txt            || echo "N/A")
          ASR=$(grep -oP 'ATTACK SUCCESS RATE\s*:\s*\K[0-9.]+%' scan-output.txt || echo "N/A")
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "asr=$ASR"     >> "$GITHUB_OUTPUT"

      # ── Upload SARIF to GitHub Security tab ────────────────────────────────
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/
          category: crucible

      # ── Comment on PR with scan summary ────────────────────────────────────
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const score   = '${{ steps.metrics.outputs.score }}';
            const level   = '${{ steps.metrics.outputs.level }}';
            const asr     = '${{ steps.metrics.outputs.asr }}';
            const passed  = '${{ steps.scan.outcome }}' === 'success';
            const badge   = passed ? '✅' : '❌';
            const status  = passed
              ? 'PASSED — risk score within threshold'
              : 'FAILED — risk score exceeds CI threshold (20)';

            const body = [
              `## ${badge} CRUCIBLE Scan`,
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| Overall Risk Score | **${score}** / 100 |`,
              `| Risk Level | ${level} |`,
              `| Attack Success Rate | ${asr} |`,
              `| CI Threshold | 20 |`,
              `| Status | ${status} |`,
              '',
              '> SARIF results uploaded to the [Security tab](../../security/code-scanning).',
            ].join('\n');

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── Fail the workflow if the scan breached the threshold ────────────────
      - name: Enforce CI gate
        if: steps.scan.outputs.scan_exit != '0'
        run: |
          echo "CRUCIBLE scan failed (exit ${{ steps.scan.outputs.scan_exit }})."
          exit 1
