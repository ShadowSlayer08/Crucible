<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="REDai mark">
  <defs>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3355"/>
      <stop offset="1" stop-color="#b10021"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b80"/>
      <stop offset="0.55" stop-color="#ff2e4d"/>
      <stop offset="1" stop-color="#c00028"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- app-icon ground -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="#242833" stroke-width="2"/>

  <!-- outer hex node (flat-top) -->
  <polygon points="406,256 331,386 181,386 106,256 181,126 331,126"
           fill="none" stroke="url(#crimson)" stroke-width="14"
           stroke-linejoin="round" opacity="0.95"/>
  <!-- faint inner hex for depth -->
  <polygon points="366,256 311,351 201,351 146,256 201,161 311,161"
           fill="none" stroke="#ff3355" stroke-width="2" opacity="0.18"/>

  <!-- reticle crosshair with center gap -->
  <g stroke="url(#crimson)" stroke-width="13" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="214"/>
    <line x1="256" y1="298" x2="256" y2="392"/>
    <line x1="120" y1="256" x2="214" y2="256"/>
    <line x1="298" y1="256" x2="392" y2="256"/>
  </g>

  <!-- neural probe nodes on the arms -->
  <g fill="#ff516b">
    <circle cx="256" cy="120" r="12"/>
    <circle cx="256" cy="392" r="12"/>
    <circle cx="120" cy="256" r="12"/>
    <circle cx="392" cy="256" r="12"/>
  </g>

  <!-- breach accent: brightened top-right vertex -->
  <circle cx="331" cy="126" r="16" fill="#ff8a9c" filter="url(#glow)"/>

  <!-- target core -->
  <circle cx="256" cy="256" r="30" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="11" fill="#fff2f4"/>
</svg>
