<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="REDai — Adversarial AI, tested.">
  <defs>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3355"/>
      <stop offset="1" stop-color="#b10021"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1016"/>
      <stop offset="1" stop-color="#15100f"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b80"/>
      <stop offset="0.55" stop-color="#ff2e4d"/>
      <stop offset="1" stop-color="#c00028"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .wm  { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
      .tag { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 500; }
      .mono{ font-family: "SFMono-Regular", "Consolas", "Menlo", monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.035">
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- mark (scaled ~0.72, centered around x=250,y=300) -->
  <g transform="translate(70,120) scale(0.72)">
    <polygon points="406,256 331,386 181,386 106,256 181,126 331,126"
             fill="none" stroke="url(#crimson)" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="366,256 311,351 201,351 146,256 201,161 311,161"
             fill="none" stroke="#ff3355" stroke-width="2" opacity="0.18"/>
    <g stroke="url(#crimson)" stroke-width="13" stroke-linecap="round">
      <line x1="256" y1="120" x2="256" y2="214"/><line x1="256" y1="298" x2="256" y2="392"/>
      <line x1="120" y1="256" x2="214" y2="256"/><line x1="298" y1="256" x2="392" y2="256"/>
    </g>
    <g fill="#ff516b">
      <circle cx="256" cy="120" r="12"/><circle cx="256" cy="392" r="12"/>
      <circle cx="120" cy="256" r="12"/><circle cx="392" cy="256" r="12"/>
    </g>
    <circle cx="331" cy="126" r="16" fill="#ff8a9c" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="30" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="11" fill="#fff2f4"/>
  </g>

  <!-- wordmark -->
  <text x="470" y="330" class="wm" font-size="150" fill="#f5f6f8">RED<tspan fill="#ff3355">ai</tspan></text>
  <!-- accent underline -->
  <rect x="474" y="356" width="300" height="6" rx="3" fill="url(#crimson)"/>
  <!-- tagline -->
  <text x="476" y="410" class="tag" font-size="34" fill="#aeb4c0">Adversarial AI, tested.</text>
  <!-- footer strip -->
  <text x="476" y="470" class="mono" font-size="22" fill="#6b7280">AI RED TEAM CLI · v3.0 · ATLAS / OWASP / NIST</text>
</svg>
