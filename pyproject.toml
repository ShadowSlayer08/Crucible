[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-airt"
version = "3.0.0"
description = "CRUCIBLE — Trial by fire for AI. Automated adversarial testing and purple-team assessment for LLM/agentic systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AI Red Team Practice" }]
keywords = ["ai-security", "red-team", "llm", "jailbreak", "owasp", "mitre-atlas", "guardrails"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf        = ["reportlab>=4.0"]
server     = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
docs       = ["openpyxl>=3.1", "python-docx>=1.1"]
browser    = ["playwright>=1.40"]
dev        = ["pytest>=8.0", "reportlab>=4.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "openpyxl>=3.1", "python-docx>=1.1"]
all        = ["reportlab>=4.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "openpyxl>=3.1", "python-docx>=1.1"]

# `crucible ...` (or the short `cru`) instead of `python main.py ...`
[project.scripts]
crucible = "main:main"
cru = "main:main"

[tool.setuptools]
py-modules = [
    "agenthound", "audit",
    "atlas_reporter", "auto", "benchmarks", "benchmark_suites", "budget", "capability_profiler",
    "checkpoint", "classifier", "classifier_eval", "colors", "compliance", "corpus",
    "config_loader", "coverage_report", "crescendo", "declarative", "defence_audit", "discover",
    "dynamic_engine", "embeddings", "engine", "engine_browser", "extraction", "fullstack",
    "graders", "guardrails", "length_optimizer", "local_engine", "longcontext", "main",
    "metadata", "metrics", "modelscan", "multimodal",
    "multiturn", "nist", "notify", "obfuscation_wrapper", "owasp", "owasp_agentic",
    "remediation",
    "payload_audit", "payload_loader", "plugins", "policy_gen", "profile_presets",
    "reporter", "roe", "sampling", "scope_wizard", "server", "stats", "tap",
    "threat_ontology", "transferability", "trend", "vector_poison",
]

[tool.setuptools.packages.find]
include = ["payloads*", "kb*", "slm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
