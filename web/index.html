<!-- AI Red Team CLI — single-file dashboard (zero build step).
     Vanilla JS + fetch + SSE. Talks to the FastAPI server on the same origin:
       GET  /modes  /schemas  /tests?mode=
       POST /scan            (dry-run cost estimate, or full live scan)
       POST /scan/stream     (Server-Sent Events, live per-test results)
     Serve it with:  python -m redai --serve      (or python server.py) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Red Team CLI — Dashboard</title>
<style>
  :root {
    --bg:#0d0f16; --panel:#161923; --panel2:#1b1f2b; --border:#2a2f3d;
    --fg:#e7e9f0; --dim:#8b91a3; --accent:#5b9dff; --accent2:#a78bfa;
    --red:#ff5b6e; --orange:#ffa53b; --yellow:#ffd23b; --green:#3fd07d; --blue:#5b9dff;
    --grad: linear-gradient(135deg,#5b9dff,#a78bfa);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    padding:0; min-height:100vh;
    font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#1a2136 0%,var(--bg) 55%);
    color:var(--fg);
  }
  code,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header {
    padding:22px 28px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    background:rgba(13,15,22,.6); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  header h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  header h1 .dot { color:var(--red); }
  header .ver { font-size:12px; color:var(--dim); }
  header .status { margin-left:auto; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:7px; }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--dim); box-shadow:0 0 0 0 rgba(63,208,125,.5); }
  .pulse.on { background:var(--green); animation:pulse 2s infinite; }
  .pulse.err { background:var(--red); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,208,125,.5);} 70%{box-shadow:0 0 0 8px rgba(63,208,125,0);} 100%{box-shadow:0 0 0 0 rgba(63,208,125,0);} }
  main { max-width:1280px; margin:0 auto; padding:22px; display:grid;
         grid-template-columns:340px 1fr; gap:18px; align-items:start; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 16px 18px; }
  .panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent);
    margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  .panel h2 .n { color:var(--dim); font-weight:400; letter-spacing:0; text-transform:none; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:12px 0 5px; }
  input,select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--fg); font-size:13px; }
  input:focus,select:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:10px; } .row > * { flex:1; min-width:0; }
  .toggle { display:flex; align-items:center; gap:9px; margin-top:14px; cursor:pointer; user-select:none; }
  .toggle input { width:auto; }
  .toggle .hint { font-size:11px; color:var(--dim); text-transform:none; letter-spacing:0; }
  button { cursor:pointer; border:none; border-radius:9px; font-size:13px; font-weight:600; padding:11px 14px; color:#fff; }
  button.primary { background:var(--grad); width:100%; margin-top:16px; }
  button.ghost { background:var(--panel2); border:1px solid var(--border); color:var(--fg); font-weight:500; padding:7px 11px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { font-size:11px; padding:4px 9px; border-radius:20px; border:1px solid var(--border);
    background:var(--panel2); color:var(--dim); cursor:pointer; }
  .chip.on { color:#fff; border-color:transparent; background:var(--accent); }
  .empty { color:var(--dim); text-align:center; padding:40px 12px; }
  .empty .big { font-size:34px; opacity:.5; }
  /* metrics */
  .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:640px){ .metrics{ grid-template-columns:repeat(2,1fr);} }
  .metric { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .metric .k { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .metric .v { font-size:26px; font-weight:700; margin-top:3px; line-height:1; }
  .metric .s { font-size:11px; color:var(--dim); margin-top:4px; }
  .gauge { display:flex; align-items:center; gap:16px; }
  .ring { --p:0; --c:var(--green); width:88px; height:88px; border-radius:50%; flex:0 0 auto;
    background:conic-gradient(var(--c) calc(var(--p)*1%), #232838 0);
    display:grid; place-items:center; }
  .ring::before { content:""; width:66px; height:66px; border-radius:50%; background:var(--panel); position:absolute; }
  .ring b { position:relative; font-size:22px; }
  .ring .lbl { position:relative; font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-top:1px; }
  /* progress */
  .bar { height:8px; border-radius:6px; background:var(--panel2); overflow:hidden; margin:4px 0 2px; }
  .bar > i { display:block; height:100%; background:var(--grad); width:0; transition:width .25s; }
  .vbars { display:flex; flex-direction:column; gap:7px; margin-top:4px; }
  .vbar { display:grid; grid-template-columns:120px 1fr 42px; align-items:center; gap:10px; font-size:12px; }
  .vbar .track { height:14px; border-radius:5px; background:var(--panel2); overflow:hidden; }
  .vbar .track > i { display:block; height:100%; }
  /* results table */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim);
    padding:8px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); }
  td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:hover td { background:var(--panel2); }
  .tbl-wrap { max-height:520px; overflow:auto; border:1px solid var(--border); border-radius:10px; }
  .pill { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .v-PASS{ background:rgba(63,208,125,.16); color:var(--green);}
  .v-FAIL{ background:rgba(255,91,110,.16); color:var(--red);}
  .v-WARN{ background:rgba(255,210,59,.16); color:var(--yellow);}
  .v-ERROR{ background:rgba(139,145,163,.16); color:var(--dim);}
  .v-SILENT{ background:rgba(91,157,255,.16); color:var(--blue);}
  .v-PARTIAL_REFUSAL{ background:rgba(255,165,59,.16); color:var(--orange);}
  .sev-Critical{ color:var(--red);} .sev-High{ color:var(--orange);} .sev-Medium{ color:var(--yellow);} .sev-Low{ color:var(--dim);}
  .muted { color:var(--dim); }
  .reason { color:var(--dim); font-size:11.5px; max-width:340px; }
  .banner { padding:10px 12px; border-radius:9px; font-size:12.5px; margin-bottom:14px; }
  .banner.err { background:rgba(255,91,110,.12); border:1px solid rgba(255,91,110,.3); color:#ffb3bd; }
  .banner.info { background:rgba(91,157,255,.1); border:1px solid rgba(91,157,255,.28); color:#bcd4ff; }
  .foot { color:var(--dim); font-size:11px; text-align:center; padding:18px; }
  .cov-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cov { font-size:10.5px; padding:3px 7px; border-radius:6px; border:1px solid var(--border); background:var(--panel2); }
  .cov.hit{ border-color:rgba(255,91,110,.5); color:var(--red);}
  .cov.ok{ border-color:rgba(63,208,125,.4); color:var(--green);}
  .cov.untested{ color:var(--dim); opacity:.6; }
</style>

<header>
  <h1>AI Red Team<span class="dot"> ●</span> CLI</h1>
  <span class="ver" id="ver">v—</span>
  <div class="status"><span class="pulse" id="pulse"></span><span id="statusText">connecting…</span></div>
</header>

<main>
  <!-- ── Left: connection + test picker ─────────────────────────────── -->
  <section class="panel" id="controls">
    <h2>Target &amp; Scan <span class="n" id="modeCount"></span></h2>

    <label>Mode</label>
    <select id="mode"></select>

    <label>Endpoint <span class="muted" style="text-transform:none;letter-spacing:0">(leave blank for dry-run)</span></label>
    <input id="endpoint" placeholder="http://localhost:11434/v1/chat/completions" autocomplete="off">

    <div class="row">
      <div><label>Schema</label><select id="schema"></select></div>
      <div><label>Model</label><input id="model" value="qwen2.5:7b" autocomplete="off"></div>
    </div>

    <label>API key <span class="muted" style="text-transform:none;letter-spacing:0">(never stored)</span></label>
    <input id="apiKey" type="password" placeholder="optional — Bearer token" autocomplete="off">

    <label>Severity filter</label>
    <div class="chips" id="sevChips">
      <span class="chip on" data-sev="Critical">Critical</span>
      <span class="chip on" data-sev="High">High</span>
      <span class="chip on" data-sev="Medium">Medium</span>
      <span class="chip on" data-sev="Low">Low</span>
    </div>

    <div class="row" style="margin-top:12px">
      <div><label>Limit</label><input id="limit" type="number" min="0" placeholder="all" autocomplete="off"></div>
      <div><label>Tests in mode</label><input id="poolCount" value="—" disabled></div>
    </div>

    <label class="toggle"><input type="checkbox" id="dry" checked>
      <span>Dry run <span class="hint">(estimate only — no traffic)</span></span></label>

    <button class="primary" id="run">▶ Run scan</button>
  </section>

  <!-- ── Right: run + results ───────────────────────────────────────── -->
  <section>
    <div id="msg"></div>

    <div class="panel" id="runPanel" style="margin-bottom:18px; display:none">
      <h2>Live run <span class="n" id="runNote"></span></h2>
      <div class="bar"><i id="prog"></i></div>
      <div class="muted" id="progText" style="font-size:12px">idle</div>
    </div>

    <div class="panel" id="resultsPanel">
      <h2>Results</h2>
      <div id="results">
        <div class="empty"><div class="big">🎯</div>
          Configure a target and run a scan.<br>
          <span class="muted">Dry run estimates cost with zero traffic. Add an endpoint and untick “Dry run” to execute live.</span>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="foot mono" id="foot"></div>

<script>
const $ = (s) => document.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = (s) => String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { modes:[], pool:0 };

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok){ let d; try{d=(await r.json()).detail}catch{} throw new Error(d||(r.status+" "+r.statusText)); } return r.json(); }

async function boot(){
  try{
    const h = await api("/health");
    $("#ver").textContent = "v"+h.version;
    $("#pulse").classList.add("on"); $("#statusText").textContent = h.schemas+" schemas · "+h.modes+" modes";
  }catch(e){ $("#pulse").classList.add("err"); $("#statusText").textContent="server offline"; return; }

  const [modes, schemas] = await Promise.all([api("/modes"), api("/schemas")]);
  state.modes = modes.modes;
  $("#modeCount").textContent = modes.count+" modes";
  const msel = $("#mode");
  modes.modes.forEach(m => msel.append(new Option(m.name+"  ("+m.test_count+")", m.name)));
  const ssel = $("#schema");
  schemas.schemas.forEach(s => ssel.append(new Option(s.name, s.name)));
  ssel.value = [...ssel.options].some(o=>o.value==="openai") ? "openai" : ssel.options[0]?.value;
  msel.value = "vapt";
  msel.onchange = refreshPool; refreshPool();
}

function selectedSeverities(){ return [...document.querySelectorAll(".chip.on")].map(c=>c.dataset.sev); }
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { c.classList.toggle("on"); });

async function refreshPool(){
  const mode = $("#mode").value;
  try{ const t = await api("/tests?mode="+encodeURIComponent(mode)); state.pool=t.count; $("#poolCount").value=t.count+" tests"; }
  catch{ $("#poolCount").value="—"; }
}

function reqBody(){
  const sev = selectedSeverities();
  const limRaw = $("#limit").value.trim();
  return {
    mode: $("#mode").value,
    dry_run: $("#dry").checked,
    severities: sev.length===4 ? null : sev,
    limit: limRaw==="" ? null : Math.max(0, parseInt(limRaw,10)||0),
    config: {
      endpoint: $("#endpoint").value.trim(),
      api_key: $("#apiKey").value,
      model: $("#model").value.trim() || "gpt-4o",
      schema: $("#schema").value,
    },
  };
}

function msg(kind, html){ $("#msg").innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : ""; }

$("#run").onclick = async () => {
  const body = reqBody();
  $("#run").disabled = true; msg("");
  try {
    if (body.dry_run || !body.config.endpoint) { await dryRun(body); }
    else { await liveRun(body); }
  } catch(e){ msg("err", "✗ "+esc(e.message)); }
  finally { $("#run").disabled = false; }
};

async function dryRun(body){
  body.dry_run = true;
  const r = await api("/scan", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  $("#runPanel").style.display="none";
  const c = r.cost_estimate;
  msg("info", `Dry run — <b>${r.selected_tests}</b> tests selected, no endpoint contacted.`);
  $("#results").innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="k">Tests</div><div class="v">${r.selected_tests}</div><div class="s">mode: ${esc(r.mode)}</div></div>
      <div class="metric"><div class="k">Prompt tokens</div><div class="v">${c.prompt_tokens.toLocaleString()}</div><div class="s">est.</div></div>
      <div class="metric"><div class="k">Total tokens</div><div class="v">${c.estimated_tokens.toLocaleString()}</div><div class="s">+${c.assumed_response_tokens_per_test}/test resp.</div></div>
      <div class="metric"><div class="k">Est. cost</div><div class="v">$${c.estimated_usd}</div><div class="s">@ $${c.usd_per_1k_tokens}/1k</div></div>
    </div>
    <div class="muted" style="font-size:12px">${esc(r.note)}</div>
    <div style="margin-top:14px" class="mono muted">${r.test_ids.map(esc).join("  ·  ")}</div>`;
}

// Live run via SSE (POST + streamed body parse — EventSource can't POST).
async function liveRun(body){
  body.dry_run = false;
  $("#runPanel").style.display=""; $("#prog").style.width="0"; $("#progText").textContent="starting…";
  $("#runNote").textContent = body.mode;
  $("#results").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
     <th>#</th><th>ID</th><th>Test</th><th>Sev</th><th>Verdict</th><th>Reason</th></tr>
     <tbody id="live"></tbody></table></div>`;
  const tbody = $("#live");
  let done = null;

  const resp = await fetch("/scan/stream", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!resp.ok){ let d; try{d=(await resp.json()).detail}catch{} throw new Error(d||("stream "+resp.status)); }
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf="";
  while(true){
    const {value,done:fin} = await reader.read(); if(fin) break;
    buf += dec.decode(value,{stream:true});
    let idx;
    while((idx = buf.indexOf("\n\n")) >= 0){
      const chunk = buf.slice(0,idx); buf = buf.slice(idx+2);
      const ev = /event:\s*(\w+)/.exec(chunk); const dm = /data:\s*([\s\S]*)$/.exec(chunk);
      if(!ev||!dm) continue;
      const data = JSON.parse(dm[1]);
      if(ev[1]==="test"){
        const pct = Math.round(data.index/data.total*100);
        $("#prog").style.width = pct+"%";
        $("#progText").textContent = `${data.index} / ${data.total} — ${data.id}`;
        const tr = el("tr", null,
          `<td class="muted">${data.index}</td><td class="mono">${esc(data.id)}</td>`+
          `<td>${esc(data.name)}</td><td class="sev-${esc(data.severity)}">${esc(data.severity)}</td>`+
          `<td><span class="pill v-${esc(data.verdict)}">${esc(data.verdict)}</span></td>`+
          `<td class="reason">${esc(data.reason||"")}</td>`);
        tbody.append(tr); tr.scrollIntoView({block:"nearest"});
      } else if(ev[1]==="done"){ done = data; }
    }
  }
  $("#progText").textContent = "complete";
  if(done) renderSummary(done);
}

function renderSummary(r){
  const s = r.scores, sev = s.risk_level, score = s.overall_risk_score;
  const t = s.totals;
  const col = score>=70?"var(--red)":score>=45?"var(--orange)":score>=20?"var(--yellow)":"var(--green)";
  const asr = r.asr, cov = r.coverage, gr = r.guardrails;
  // stats.asr_ci already returns percentages (1 dp).
  const asrPct = asr.asr.toFixed(1), lo = asr.low.toFixed(1), hi = asr.high.toFixed(1);

  const vb = ["FAIL","WARN","PARTIAL_REFUSAL","SILENT","PASS","ERROR"].map(v=>{
    const n = t[v.toLowerCase()]||0; const tot = Object.values(t).reduce((a,b)=>a+b,0)||1;
    const w = Math.round(n/tot*100);
    const cmap={FAIL:"var(--red)",WARN:"var(--yellow)",PARTIAL_REFUSAL:"var(--orange)",SILENT:"var(--blue)",PASS:"var(--green)",ERROR:"var(--dim)"};
    return `<div class="vbar"><span class="pill v-${v}">${v}</span>
      <div class="track"><i style="width:${w}%;background:${cmap[v]}"></i></div><span class="muted">${n}</span></div>`;
  }).join("");

  const covPct = Math.round((cov.coverage_score||0)*100);
  const covCells = Object.entries(cov.categories||{}).map(([code,c])=>{
    const cls = c.status==="HIT"?"hit":c.status==="TESTED"?"ok":"untested";
    return `<span class="cov ${cls}" title="${esc(code)} ${esc(c.name||"")} — ${esc(c.status)}">${esc(code)}</span>`;
  }).join("");

  const summary = el("div", null, `
    <div class="metrics">
      <div class="metric" style="grid-row:span 2"><div class="k">Risk score</div>
        <div class="gauge"><div class="ring" style="--p:${score};--c:${col}"><b style="color:${col}">${score}</b><span class="lbl">${esc(sev)}</span></div></div>
      </div>
      <div class="metric"><div class="k">Attack success rate</div><div class="v" style="color:${col}">${asrPct}%</div>
        <div class="s">95% CI ${lo}–${hi}% · n=${asr.n}</div></div>
      <div class="metric"><div class="k">Policy coverage</div><div class="v">${covPct}%</div>
        <div class="s">${cov.covered??0}/${cov.total??0} categories</div></div>
      <div class="metric"><div class="k">Guardrail block-rate</div><div class="v">${gr.block_rate}%</div>
        <div class="s">${gr.blocked_fails}/${gr.total_fails} fails · FP ${gr.fp_rate}%</div></div>
    </div>
    <div class="row" style="gap:18px;align-items:flex-start">
      <div style="flex:1.1"><label style="margin-top:0">Verdict breakdown</label><div class="vbars">${vb}</div></div>
      <div style="flex:1"><label style="margin-top:0">Policy / Llama-Guard coverage</label><div class="cov-grid">${covCells||'<span class="muted">n/a</span>'}</div></div>
    </div>`);

  // Prepend the summary above the live table.
  $("#results").prepend(summary);
  const failN = t.fail||0;
  msg(failN?"err":"info", failN
    ? `⚠ <b>${failN}</b> attack${failN>1?"s":""} succeeded — risk <b>${esc(sev)}</b> (${score}/100).`
    : `✓ No attacks succeeded — risk <b>${esc(sev)}</b> (${score}/100).`);
  $("#foot").textContent = `scored ${asr.n} evaluated · ${t.error||0} errors · mode ${r.mode}`;
}

boot();
</script>
