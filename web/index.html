<!-- AI Red Team CLI — minimal single-file dashboard.
     Vanilla JS, no build step. Calls /schemas, /modes, and (optionally)
     a dry-run /scan against the same origin that served this page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Red Team CLI — Dashboard</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --border: #2a2f3d;
    --fg: #e6e8ee; --dim: #8b91a3; --accent: #5b9dff;
    --red: #ff5b5b; --orange: #ffa53b; --green: #4cd07d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: none; }
  .name { font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  .count { color: var(--accent); }
  .controls { margin: 20px 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button {
    font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  button { cursor: pointer; background: var(--accent); color: #0a0c12; border-color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    color: var(--dim); max-height: 320px;
  }
  .err { color: var(--red); }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px;
    background: var(--border); color: var(--fg); margin-left: 6px;
  }
  .sev-Critical { color: var(--red); }
  .sev-High { color: var(--orange); }
  .sev-Medium { color: #e6c84c; }
  .sev-Low { color: var(--green); }
  footer { color: var(--dim); margin-top: 24px; font-size: 12px; }
</style>

<h1>AI Red Team CLI <span class="badge" id="version">…</span></h1>
<div class="sub">API-first dashboard &middot; provider schemas, scan modes, and dry-run cost estimates.</div>

<div class="grid">
  <div class="panel">
    <h2>Provider Schemas (<span class="count" id="schema-count">…</span>)</h2>
    <ul id="schemas"><li class="meta">Loading…</li></ul>
  </div>
  <div class="panel">
    <h2>Scan Modes (<span class="count" id="mode-count">…</span>)</h2>
    <ul id="modes"><li class="meta">Loading…</li></ul>
  </div>
</div>

<div class="controls">
  <label for="mode-select" class="meta">Dry-run mode:</label>
  <select id="mode-select"></select>
  <button id="estimate-btn">Estimate (dry run)</button>
  <span class="meta" id="estimate-status"></span>
</div>
<pre id="estimate-out">No estimate yet — pick a mode and click “Estimate”.</pre>

<footer>Authorized testing only. Dry runs never contact any endpoint.</footer>

<script>
  const $ = (id) => document.getElementById(id);

  async function getJSON(url, opts) {
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
  }

  async function loadHealth() {
    try {
      const h = await getJSON("/health");
      $("version").textContent = "v" + h.version;
    } catch (e) {
      $("version").textContent = "offline";
    }
  }

  async function loadSchemas() {
    const ul = $("schemas");
    try {
      const data = await getJSON("/schemas");
      $("schema-count").textContent = data.count;
      ul.innerHTML = "";
      for (const s of data.schemas) {
        const li = document.createElement("li");
        li.innerHTML = `<span class="name">${s.name}</span>` +
          `<div class="meta">${(s.notes || "").slice(0, 90)}</div>`;
        ul.appendChild(li);
      }
    } catch (e) {
      ul.innerHTML = `<li class="err">Failed to load schemas: ${e.message}</li>`;
    }
  }

  async function loadModes() {
    const ul = $("modes");
    const sel = $("mode-select");
    try {
      const data = await getJSON("/modes");
      $("mode-count").textContent = data.count;
      ul.innerHTML = "";
      sel.innerHTML = "";
      for (const m of data.modes) {
        const li = document.createElement("li");
        li.innerHTML = `<span class="name">${m.name}</span>` +
          `<span class="badge">${m.test_count} tests</span>` +
          `<div class="meta">${m.label}</div>`;
        ul.appendChild(li);

        const opt = document.createElement("option");
        opt.value = m.name;
        opt.textContent = `${m.name} (${m.test_count})`;
        sel.appendChild(opt);
      }
    } catch (e) {
      ul.innerHTML = `<li class="err">Failed to load modes: ${e.message}</li>`;
    }
  }

  async function estimate() {
    const mode = $("mode-select").value;
    const out = $("estimate-out");
    $("estimate-status").textContent = "running…";
    try {
      const data = await getJSON("/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode, dry_run: true }),
      });
      out.textContent = JSON.stringify(data, null, 2);
      $("estimate-status").textContent = "done";
    } catch (e) {
      out.textContent = "Error: " + e.message;
      $("estimate-status").textContent = "failed";
    }
  }

  $("estimate-btn").addEventListener("click", estimate);

  loadHealth();
  loadSchemas();
  loadModes();
</script>
